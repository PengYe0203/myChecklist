spring.application.name=mychecklist
spring.profiles.active=local

# MySQL配置
# MySQL 8.0 以上版本通用驱动
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# 数据库地址
spring.datasource.url=jdbc:mysql://gateway01.ap-southeast-1.prod.alicloud.tidbcloud.com:4000/my_checklist?sslMode=VERIFY_IDENTITY
# 数据库用户名
spring.datasource.username=YOUR_TIDB_USER
# 数据库密码
spring.datasource.password=YOUR_TIDB_PASSWORD

# MyBatis-Plus配置
# 在控制台打印 SQL 日志，方便调试
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
# 自动把数据库字段下划线转换为 Java 驼峰命名
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 自增主键策略，使用数据库自带的自增功能
mybatis-plus.global-config.db-config.id-type=auto

# JWT配置
jwt.secret=randomly_generated_32_byte_string
jwt.expiration=depends_on_your_requirements_in_milliseconds
