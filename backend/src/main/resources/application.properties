spring.application.name=mychecklist
spring.profiles.active=local

# MySQL配置
# MySQL 8.0 以上版本通用驱动
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# 数据库地址
spring.datasource.url=jdbc:mysql://gateway01.ap-southeast-1.prod.alicloud.tidbcloud.com:4000/my_checklist?sslMode=VERIFY_IDENTITY
# 数据库用户名
spring.datasource.username=YOUR_TIDB_USER
# 数据库密码
spring.datasource.password=YOUR_TIDB_PASSWORD

# MyBatis-Plus配置
# 在控制台打印 SQL 日志，方便调试
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
# 自动把数据库字段下划线转换为 Java 驼峰命名
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 自增主键策略，使用数据库自带的自增功能
mybatis-plus.global-config.db-config.id-type=auto

# JWT配置
jwt.secret=RANDOMLY_GENERATED_STRING_WITH_32_CHARACTERS_OR_MORE
jwt.expiration=DEPENDS_ON_YOUR_REQUIREMENTS_IN_MILLISECONDS

# 任务计时与心跳配置
# 前端心跳执行频率，建议使用 Spring Duration 格式（如 60s, 1m）
checklist.heartbeat.interval=60s
checklist.heartbeat.interval-ms=60000
# 心跳超时阈值(秒)，超过此时间未见心跳则判定为僵尸任务并强制停止，默认5分钟
checklist.heartbeat.timeout-threshold=300

# Redis配置
# Spring Boot 3.0 以上版本的新前缀
spring.data.redis.url=...
spring.data.redis.host=...
spring.data.redis.port=...
spring.data.redis.password=...
spring.data.redis.ssl.enabled=true
# Redission只认这套旧前缀
spring.redis.url=...
spring.redis.host=...
spring.redis.port=...
spring.redis.password=...
spring.redis.ssl=true
# Lettuce连接池配置
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=0
spring.redis.lettuce.pool.max-wait=1000ms

# 邮箱配置
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_GMAIL_ADDRESS
spring.mail.password=YOUR_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8
