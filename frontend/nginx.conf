resolver 127.0.0.11 valid=10s ipv6=off;

upstream backend_pool {
  zone backend_pool 64k;
  least_conn;
  server backend:8080 resolve;
}

# HTTP → HTTPS 重定向
server {
  listen 80;
  server_name mychecklist.top www.mychecklist.top;
  return 301 https://$host$request_uri;
}

# HTTPS 主服务
server {
  listen 443 ssl;
  http2 on;
  server_name mychecklist.top www.mychecklist.top;

  # SSL 证书（阿里云免费证书，挂载自 /home/ssl/）
  ssl_certificate     /etc/nginx/ssl/mychecklist.top.pem;
  ssl_certificate_key /etc/nginx/ssl/mychecklist.top.key;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://backend_pool;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
